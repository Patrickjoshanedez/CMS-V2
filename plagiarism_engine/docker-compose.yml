# ─────────────────────────────────────────────────────────────────────────────
# Plagiarism Engine — Standalone FastAPI Stack
# Run from plagiarism_engine/:
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  plagiarism_api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: ${PLAGIARISM_TORCH_VARIANT:-cpu}
    container_name: cms-plagiarism-api
    restart: unless-stopped
    command: >
      uvicorn plagiarism_engine.main:app
      --host 0.0.0.0
      --port 8001
      --workers ${PLAGIARISM_API_WORKERS:-1}
      --limit-concurrency ${PLAGIARISM_API_LIMIT_CONCURRENCY:-32}
      --log-level info
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - chroma_data:/app/chroma_store
      - model_cache:/app/.cache/huggingface
    cpus: ${PLAGIARISM_API_CPUS:-1.5}
    mem_limit: ${PLAGIARISM_API_MEMORY_LIMIT:-2g}
    env_file:
      - path: .env
        required: false
    environment:
      - PLAGIARISM_ASYNC_BACKEND=inprocess
      - EMBEDDING_MODEL=${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_PERSIST_DIR=/app/chroma_store
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - ANONYMIZED_TELEMETRY=FALSE
      - EMBEDDING_DEVICE=${PLAGIARISM_EMBEDDING_DEVICE:-cpu}
      - EMBEDDING_BATCH_SIZE=${PLAGIARISM_EMBEDDING_BATCH_SIZE:-24}
      - OMP_NUM_THREADS=${PLAGIARISM_OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${PLAGIARISM_MKL_NUM_THREADS:-2}
      - TORCH_NUM_THREADS=${PLAGIARISM_TORCH_NUM_THREADS:-2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - plagiarism_net

volumes:
  chroma_data:
    driver: local
  model_cache:
    driver: local

networks:
  plagiarism_net:
    driver: bridge
