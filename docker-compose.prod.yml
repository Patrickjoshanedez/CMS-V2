name: cms-v2-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7
    container_name: cms-mongodb-prod
    restart: unless-stopped
    init: true
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: cms-redis-prod
    restart: unless-stopped
    init: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be non-empty}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  cms-ocr-engine:
    build:
      context: ./ocr_engine
      dockerfile: Dockerfile
    container_name: cms-ocr-engine-prod
    restart: unless-stopped
    init: true
    environment:
      LOG_LEVEL: WARNING
      HOST: 0.0.0.0
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  server:
    build:
      context: .
      dockerfile: Dockerfile.server.prod
    command: npm run start --workspace=server
    container_name: cms-server-prod
    restart: unless-stopped
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cms-ocr-engine:
        condition: service_healthy
      plagiarism_api:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5000
      STORAGE_MODE: ${STORAGE_MODE:-filesystem}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/uploads}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/cms_v2}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD?REDIS_PASSWORD is required}
      CLIENT_URL: ${CLIENT_URL?CLIENT_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@cms-buksu.edu.ph}
      S3_BUCKET: ${S3_BUCKET:-cms-buksu-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      ALLOW_PRODUCTION_S3_BUCKET_OVERRIDE: ${ALLOW_PRODUCTION_S3_BUCKET_OVERRIDE:-false}
      ALLOW_PRODUCTION_LOCALSTACK_TESTING: ${ALLOW_PRODUCTION_LOCALSTACK_TESTING:-false}
      PUBLIC_EXPOSURE_MODE: ${PUBLIC_EXPOSURE_MODE:-false}

      # === OCR & Plagiarism Detection (Production Thresholds) ===
      OCR_ENGINE_URL: http://cms-ocr-engine:8000
      PLAGIARISM_ENGINE_URL: http://plagiarism_api:8001
      PLAGIARISM_WARNING_THRESHOLD: ${PLAGIARISM_WARNING_THRESHOLD:-25}
      PLAGIARISM_REJECT_THRESHOLD: ${PLAGIARISM_REJECT_THRESHOLD:-40}
      PLAGIARISM_ENGINE_TIMEOUT: ${PLAGIARISM_ENGINE_TIMEOUT:-180000}
      PLAGIARISM_POLL_INTERVAL: ${PLAGIARISM_POLL_INTERVAL:-3000}
      PLAGIARISM_POLL_MAX_ATTEMPTS: ${PLAGIARISM_POLL_MAX_ATTEMPTS:-60}
      PLAGIARISM_EMBEDDING_MODEL: ${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OLLAMA_HOST: ""
      GOTENBERG_URL: ""
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_CAPSTONE_DOCS_FOLDER_ID: ${GOOGLE_DRIVE_CAPSTONE_DOCS_FOLDER_ID:-}
      GOOGLE_DRIVE_TEMPLATE_FOLDER_ID: ${GOOGLE_DRIVE_TEMPLATE_FOLDER_ID:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./uploads:/app/uploads
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  client:
    build:
      context: .
      dockerfile: Dockerfile.client.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_ALLOWED_ORIGINS: ${VITE_GOOGLE_ALLOWED_ORIGINS:-}
        VITE_RECAPTCHA_ENABLED: ${VITE_RECAPTCHA_ENABLED:-false}
    container_name: cms-client-prod
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # === Plagiarism Detection Service (Production Configuration) ===

  plagiarism_api:
    build:
      context: ./plagiarism_engine
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: ${PLAGIARISM_TORCH_VARIANT:-cpu}
    container_name: cms-plagiarism-api-prod
    restart: unless-stopped
    init: true
    volumes:
      - plagiarism_chroma_prod:/app/chroma_store
      - plagiarism_models_prod:/app/.cache/huggingface
    environment:
      - PLAGIARISM_ASYNC_BACKEND=inprocess
      - EMBEDDING_MODEL=${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_PERSIST_DIR=/app/chroma_store
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - ANONYMIZED_TELEMETRY=FALSE
      - LOG_LEVEL=WARNING
      - LOG_JSON=true
      - EMBEDDING_DEVICE=${PLAGIARISM_EMBEDDING_DEVICE:-cpu}
      - EMBEDDING_BATCH_SIZE=${PLAGIARISM_EMBEDDING_BATCH_SIZE:-16}
      - OMP_NUM_THREADS=${PLAGIARISM_OMP_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${PLAGIARISM_MKL_NUM_THREADS:-2}
      - TORCH_NUM_THREADS=${PLAGIARISM_TORCH_NUM_THREADS:-2}
      - MAX_DOCUMENT_SIZE=20971520 # 20MB
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

volumes:
  mongodb_prod_data:
  redis_prod_data:
  plagiarism_chroma_prod:
  plagiarism_models_prod:
