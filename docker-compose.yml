x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7
    container_name: cms-mongodb
    restart: unless-stopped
    init: true
    command: [ "mongod", "--wiredTigerCacheSizeGB", "0.5" ]
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    mem_limit: ${MONGODB_MEMORY_LIMIT:-1g}
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - cms_network

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    init: true
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-320m}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    logging: *default-logging
    networks:
      - cms_network

  cms-ocr-engine:
    build:
      context: ./ocr_engine
      dockerfile: Dockerfile
    container_name: cms-ocr-engine
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    cpus: ${OCR_ENGINE_CPUS:-1.0}
    mem_limit: ${OCR_ENGINE_MEMORY_LIMIT:-512m}
    environment:
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: "8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - cms_network

  plagiarism_api:
    build:
      context: ./plagiarism_engine
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: ${PLAGIARISM_TORCH_VARIANT:-cpu}
    container_name: cms-plagiarism-api
    restart: unless-stopped
    init: true
    command: >
      uvicorn plagiarism_engine.main:app --host 0.0.0.0 --port 8001 --workers ${PLAGIARISM_API_WORKERS:-1} --limit-concurrency ${PLAGIARISM_API_LIMIT_CONCURRENCY:-32} --log-level info
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - plagiarism_chroma:/app/chroma_store
      - plagiarism_models:/app/.cache/huggingface
    cpus: ${PLAGIARISM_API_CPUS:-2.0}
    mem_limit: ${PLAGIARISM_API_MEMORY_LIMIT:-2g}
    environment:
      PLAGIARISM_ASYNC_BACKEND: inprocess
      EMBEDDING_MODEL: ${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      CHROMA_PERSIST_DIR: /app/chroma_store
      HF_HOME: /app/.cache/huggingface
      TORCH_HOME: /app/.cache/torch
      ANONYMIZED_TELEMETRY: "FALSE"
      EMBEDDING_DEVICE: ${PLAGIARISM_EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${PLAGIARISM_EMBEDDING_BATCH_SIZE:-24}
      OMP_NUM_THREADS: ${PLAGIARISM_OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${PLAGIARISM_MKL_NUM_THREADS:-2}
      TORCH_NUM_THREADS: ${PLAGIARISM_TORCH_NUM_THREADS:-2}
      API_HOST: 0.0.0.0
      API_PORT: "8001"
      APP_CORS_ORIGINS: "http://localhost:43211,http://localhost:43210,http://cms-client:43211,${CLIENT_URL:-}"
      PLAGIARISM_ENGINE_API_TOKEN: ${PLAGIARISM_ENGINE_API_TOKEN:-}
      LOG_LEVEL: INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging: *default-logging
    networks:
      - cms_network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cms-v2-dev-base
    container_name: cms-server
    restart: unless-stopped
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cms-ocr-engine:
        condition: service_healthy
      plagiarism_api:
        condition: service_healthy
    mem_limit: ${SERVER_MEMORY_LIMIT:-1536m}
    environment:
      NODE_ENV: development
      PORT: "43210"
      CHOKIDAR_USEPOLLING: "true"
      STORAGE_MODE: filesystem
      STORAGE_LOCAL_PATH: /app/uploads
      MONGODB_URI: mongodb://mongodb:27017/cms_v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CLIENT_URL: http://localhost:43211
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OTP_EXPIRES_MINUTES: "10"
      OCR_ENGINE_URL: http://cms-ocr-engine:8000
      PLAGIARISM_ENGINE_URL: http://plagiarism_api:8001
      PLAGIARISM_ENGINE_API_TOKEN: ${PLAGIARISM_ENGINE_API_TOKEN:-}
      PLAGIARISM_ENGINE_TIMEOUT: "120000"
      PLAGIARISM_WARNING_THRESHOLD: "30"
      PLAGIARISM_REJECT_THRESHOLD: "50"
      PLAGIARISM_POLL_INTERVAL: "2000"
      PLAGIARISM_POLL_MAX_ATTEMPTS: "60"
      PLAGIARISM_RESULTS_TTL: "7776000"
      PLAGIARISM_EMBEDDING_MODEL: ${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OLLAMA_HOST: ""
      GOTENBERG_URL: ""
    ports:
      - "43210:43210"
      - "5000:43210"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - workspace_node_modules:/app/node_modules
      - server_node_modules:/app/server/node_modules
      - client_node_modules:/app/client/node_modules
      - shared_node_modules:/app/shared/node_modules
    command: npm run dev:docker --workspace=server
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:43210/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - cms_network

  client:
    build:
      context: .
      dockerfile: Dockerfile
    image: cms-v2-dev-base
    container_name: cms-client
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    mem_limit: ${CLIENT_MEMORY_LIMIT:-1536m}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:43210/api}
      VITE_API_PROXY_TARGET: http://server:43210
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "43211:43211"
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - server_node_modules:/app/server/node_modules
      - client_node_modules:/app/client/node_modules
      - shared_node_modules:/app/shared/node_modules
    command: sh -c "cd /app/client && npx vite --host 0.0.0.0 --port 43211 --strictPort"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:43211',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - cms_network

volumes:
  mongodb_data:
  redis_data:
  plagiarism_chroma:
  plagiarism_models:
    driver: local
  workspace_node_modules:
  server_node_modules:
  client_node_modules:
  shared_node_modules:

networks:
  cms_network:
    name: ${CMS_NETWORK_NAME:-cms-v2_cms_network}
    driver: bridge
