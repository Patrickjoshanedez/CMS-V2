<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 820" width="1340" height="820">
  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #475569; }
      .box-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
      .box-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #475569; }
      .msg { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; }
      .msg-err { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #991B1B; }
      .msg-ok { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1E3A8A; }
      .guard { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E3A8A; }
      .guard-err { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #991B1B; }
      .badge-txt { font-family: "Segoe UI", Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .tab-txt { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .footer { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748B; }
    </style>
    <marker id="arrowSolidBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E3A8A"/>
    </marker>
    <marker id="arrowDashBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDashRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B91C1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1340" height="820" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="670" y="38" text-anchor="middle" class="title">Authenticated API Request-Response Lifecycle</text>
  <text x="670" y="60" text-anchor="middle" class="subtitle">Project Workspace: Express 5 REST API Gateway → Auth &amp; RBAC Middleware → Controller/Service → MongoDB</text>

  <!-- Lifelines -->
  <line x1="130" y1="142" x2="130" y2="722" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="400" y1="142" x2="400" y2="722" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="670" y1="142" x2="670" y2="722" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="940" y1="142" x2="940" y2="722" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="1210" y1="142" x2="1210" y2="722" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Top Participant Boxes -->
  <g>
    <rect x="34" y="82" width="192" height="60" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="130" y="107" text-anchor="middle" class="box-title">Client</text>
    <text x="130" y="126" text-anchor="middle" class="box-sub">React 18 SPA</text>

    <rect x="304" y="82" width="192" height="60" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="400" y="107" text-anchor="middle" class="box-title">API Router</text>
    <text x="400" y="126" text-anchor="middle" class="box-sub">Express 5 (/api/*)</text>

    <rect x="574" y="82" width="192" height="60" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
    <text x="670" y="107" text-anchor="middle" class="box-title">Auth Middleware</text>
    <text x="670" y="126" text-anchor="middle" class="box-sub">authenticate() + Maintenance</text>

    <rect x="844" y="82" width="192" height="60" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="940" y="107" text-anchor="middle" class="box-title">Controller &amp; Service</text>
    <text x="940" y="126" text-anchor="middle" class="box-sub">authorize() + validate(Zod)</text>

    <rect x="1114" y="82" width="192" height="60" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="1210" y="107" text-anchor="middle" class="box-title">Database</text>
    <text x="1210" y="126" text-anchor="middle" class="box-sub">MongoDB / Mongoose 9</text>
  </g>

  <!-- Active bars (initial auth lookup) -->
  <rect x="395" y="176" width="10" height="44" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>
  <rect x="665" y="216" width="10" height="84" rx="2" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.2"/>
  <rect x="1205" y="256" width="10" height="40" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>

  <!-- Step 1: Client -> API Router -->
  <circle cx="152" cy="172" r="10" fill="#1E3A8A"/>
  <text x="152" y="176" text-anchor="middle" class="badge-txt">1</text>
  <text x="275" y="176" text-anchor="middle" class="msg">HTTP Request (JWT Cookie / Bearer)</text>
  <line x1="130" y1="186" x2="393" y2="186" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrowSolidBlue)"/>

  <!-- Step 2: API Router -> Auth Middleware -->
  <circle cx="422" cy="212" r="10" fill="#1E3A8A"/>
  <text x="422" y="216" text-anchor="middle" class="badge-txt">2</text>
  <text x="538" y="216" text-anchor="middle" class="msg">Invoke authenticate(req)</text>
  <line x1="405" y1="226" x2="663" y2="226" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrowSolidBlue)"/>

  <!-- Step 3: Auth Middleware -> Database -->
  <circle cx="692" cy="252" r="10" fill="#1E3A8A"/>
  <text x="692" y="256" text-anchor="middle" class="badge-txt">3</text>
  <text x="945" y="256" text-anchor="middle" class="msg">User.findById(decoded.userId).select('-password')</text>
  <line x1="675" y1="266" x2="1203" y2="266" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrowSolidBlue)"/>

  <!-- Step 4: Database -->> Auth Middleware -->
  <circle cx="1182" cy="288" r="10" fill="#1D4ED8"/>
  <text x="1182" y="292" text-anchor="middle" class="badge-txt">4</text>
  <text x="935" y="291" text-anchor="middle" class="msg">Return account state (isActive, isVerified, sessionVersion)</text>
  <line x1="1205" y1="300" x2="677" y2="300" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowDashBlue)"/>

  <!-- Outer ALT Block: Session Verification -->
  <rect x="44" y="322" width="1252" height="378" rx="6" fill="#F8FAFC" fill-opacity="0.6" stroke="#1E3A8A" stroke-width="1.5"/>
  <path d="M 44 322 L 104 322 L 104 338 L 94 346 L 44 346 Z" fill="#1E3A8A"/>
  <text x="72" y="338" text-anchor="middle" class="tab-txt">alt</text>
  <text x="118" y="339" class="guard-err">[Invalid, expired, or invalidated JWT (sessionVersion mismatch)]</text>

  <!-- 5a Error band -->
  <rect x="45" y="346" width="1250" height="50" fill="#FEF2F2" fill-opacity="0.72"/>
  <circle cx="642" cy="368" r="10" fill="#B91C1C"/>
  <text x="642" y="372" text-anchor="middle" class="badge-txt">5a</text>
  <text x="385" y="372" text-anchor="middle" class="msg-err">401 Unauthorized (AUTH_REQUIRED / TOKEN_EXPIRED / SESSION_INVALIDATED)</text>
  <line x1="665" y1="382" x2="132" y2="382" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashRed)"/>

  <!-- Divider -->
  <line x1="44" y1="396" x2="1296" y2="396" stroke="#1E3A8A" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="64" y="415" class="guard">[Valid authenticated session]</text>

  <!-- Active bars (valid path) -->
  <rect x="395" y="432" width="10" height="48" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>
  <rect x="935" y="466" width="10" height="214" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>
  <rect x="1205" y="602" width="10" height="44" rx="2" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.2"/>

  <!-- Step 5b: Auth Middleware -->> API Router -->
  <circle cx="642" cy="430" r="10" fill="#1D4ED8"/>
  <text x="642" y="434" text-anchor="middle" class="badge-txt">5b</text>
  <text x="525" y="434" text-anchor="middle" class="msg">Attach req.user + checkMaintenance()</text>
  <line x1="665" y1="444" x2="407" y2="444" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowDashBlue)"/>

  <!-- Step 6: API Router -> Controller -->
  <circle cx="422" cy="466" r="10" fill="#1E3A8A"/>
  <text x="422" y="470" text-anchor="middle" class="badge-txt">6</text>
  <text x="670" y="470" text-anchor="middle" class="msg">Enforce authorize(roles) &amp; validate(ZodSchema)</text>
  <line x1="405" y1="480" x2="933" y2="480" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrowSolidBlue)"/>

  <!-- Inner ALT Block: RBAC & Schema Validation -->
  <rect x="68" y="498" width="1204" height="190" rx="6" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
  <path d="M 68 498 L 124 498 L 124 514 L 114 522 L 68 522 Z" fill="#1D4ED8"/>
  <text x="94" y="514" text-anchor="middle" class="tab-txt">alt</text>
  <text x="136" y="515" class="guard-err">[Insufficient role permission or Zod validation error]</text>

  <!-- 7a Error band -->
  <rect x="69" y="522" width="1202" height="46" fill="#FEF2F2" fill-opacity="0.72"/>
  <circle cx="912" cy="542" r="10" fill="#B91C1C"/>
  <text x="912" y="546" text-anchor="middle" class="badge-txt">7a</text>
  <text x="520" y="546" text-anchor="middle" class="msg-err">403 Forbidden (FORBIDDEN) / 400 Bad Request (VALIDATION_ERROR)</text>
  <line x1="935" y1="556" x2="132" y2="556" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashRed)"/>

  <!-- Divider inside inner alt -->
  <line x1="68" y1="568" x2="1272" y2="568" stroke="#1D4ED8" stroke-width="1.1" stroke-dasharray="5,4"/>
  <text x="86" y="587" class="guard">[Authorized role and schema-valid input]</text>

  <!-- Step 7b: Controller -> Database -->
  <circle cx="962" cy="602" r="10" fill="#1E3A8A"/>
  <text x="962" y="606" text-anchor="middle" class="badge-txt">7b</text>
  <text x="1086" y="606" text-anchor="middle" class="msg">Mongoose query / atomic write</text>
  <line x1="945" y1="616" x2="1203" y2="616" stroke="#1E3A8A" stroke-width="2" marker-end="url(#arrowSolidBlue)"/>

  <!-- Step 8: Database -->> Controller -->
  <circle cx="1182" cy="634" r="10" fill="#1D4ED8"/>
  <text x="1182" y="638" text-anchor="middle" class="badge-txt">8</text>
  <text x="1072" y="638" text-anchor="middle" class="msg">Return persisted document(s)</text>
  <line x1="1205" y1="648" x2="947" y2="648" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowDashBlue)"/>

  <!-- Step 9: Controller -->> Client -->
  <circle cx="912" cy="662" r="10" fill="#1E3A8A"/>
  <text x="912" y="666" text-anchor="middle" class="badge-txt">9</text>
  <text x="520" y="666" text-anchor="middle" class="msg-ok">200 OK / 201 Created ({ "success": true, "message": "...", "data": { ... } })</text>
  <line x1="935" y1="676" x2="132" y2="676" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashBlue)"/>

  <!-- Bottom Participant Boxes -->
  <g>
    <rect x="34" y="722" width="192" height="44" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="130" y="749" text-anchor="middle" class="box-title">Client</text>

    <rect x="304" y="722" width="192" height="44" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="400" y="749" text-anchor="middle" class="box-title">API Router</text>

    <rect x="574" y="722" width="192" height="44" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
    <text x="670" y="749" text-anchor="middle" class="box-title">Auth Middleware</text>

    <rect x="844" y="722" width="192" height="44" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="940" y="749" text-anchor="middle" class="box-title">Controller &amp; Service</text>

    <rect x="1114" y="722" width="192" height="44" rx="8" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1.8"/>
    <text x="1210" y="749" text-anchor="middle" class="box-title">Database</text>
  </g>

  <!-- Footer -->
  <line x1="34" y1="782" x2="1306" y2="782" stroke="#E2E8F0" stroke-width="1"/>
  <text x="670" y="802" text-anchor="middle" class="footer">Uniform Error Envelope via errorHandler.js: { "success": false, "error": { "code", "message", "status" } }  •  Rate Limiting &amp; Audit Capture Active</text>
</svg>