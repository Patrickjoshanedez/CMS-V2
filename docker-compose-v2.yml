# ─────────────────────────────────────────────────────────────────────────────
# BukSU Capstone Management System V2 — Modernized Ecosystem (v2)
# Orchestrates ONLY the 6 core runtime services:
#   - Node.js Express 5 API Server (server)
#   - Nginx React 18 Frontend Client (client)
#   - PyMuPDF Document Parsing Microservice (cms-ocr-engine)
#   - HybridSourceTracker Plagiarism API (plagiarism_api)
#   - MongoDB 7 & Redis 7 (with local filesystem uploads)
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Document Parsing Microservice (PyMuPDF Fast-Path) ──────────────────────
  cms-ocr-engine:
    build:
      context: ./ocr_engine
      dockerfile: Dockerfile
    container_name: cms-ocr-engine
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: "8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - cms_network

  # ── Modernized Plagiarism Detection API (HST) ──────────────────────────────
  plagiarism_api:
    build:
      context: ./plagiarism_engine
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: ${PLAGIARISM_TORCH_VARIANT:-cpu}
    container_name: cms-plagiarism-api-v2
    restart: unless-stopped
    init: true
    command: >
      uvicorn plagiarism_engine.main:app --host 0.0.0.0 --port 8001 --workers 1 --limit-concurrency 32 --log-level info
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - plagiarism_chroma:/app/chroma_store
      - plagiarism_models:/app/.cache/huggingface
    environment:
      PLAGIARISM_ASYNC_BACKEND: inprocess
      CHROMA_PERSIST_DIR: /app/chroma_store
      CHROMA_COLLECTION_NAME: cms_documents_v2
      HF_HOME: /app/.cache/huggingface
      TORCH_HOME: /app/.cache/torch
      ANONYMIZED_TELEMETRY: "FALSE"
      EMBEDDING_MODEL: ${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      HST_COARSE_TOP_K: "50"
      HST_WEIGHT_WINNOWING: "0.50"
      HST_WEIGHT_DENSE: "0.30"
      HST_WEIGHT_SPARSE: "0.20"
      HST_COMPOSITE_FLAG_THRESHOLD: "0.75"
      HST_WINNOWING_CRITICAL_THRESHOLD: "0.85"
      EMBEDDING_DEVICE: ${PLAGIARISM_EMBEDDING_DEVICE:-cpu}
      TORCH_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      API_HOST: 0.0.0.0
      API_PORT: "8001"
      LOG_LEVEL: INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 25s
    logging: *default-logging
    networks:
      - cms_network

  # ── Core Primary Services ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: cms-mongodb
    restart: unless-stopped
    init: true
    command: [ "mongod", "--wiredTigerCacheSizeGB", "0.5" ]
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - cms_network

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    init: true
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 2s
      retries: 5
    logging: *default-logging
    networks:
      - cms_network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server.prod
    container_name: cms-server
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "5000"
      STORAGE_MODE: filesystem
      STORAGE_LOCAL_PATH: /app/uploads
      MONGODB_URI: mongodb://mongodb:27017/cms_v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OCR_ENGINE_URL: http://cms-ocr-engine:8000
      PLAGIARISM_ENGINE_URL: http://plagiarism_api:8001
      PLAGIARISM_EMBEDDING_MODEL: ${PLAGIARISM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OLLAMA_HOST: ""
      GOTENBERG_URL: ""
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cms-ocr-engine:
        condition: service_healthy
      plagiarism_api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - cms_network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client.prod
    container_name: cms-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    logging: *default-logging
    networks:
      - cms_network

networks:
  cms_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  plagiarism_chroma:
  plagiarism_models:
